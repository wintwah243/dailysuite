{% load static %}
<!DOCTYPE html>
<html>
<head>

    <title>Update Income</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include 'responsive_shared.html' %}
</head>
<body class="container mt-5 simple-form-page">

<h3>Update Income</h3>

<form method="POST">

</form>

</body>
</html>
