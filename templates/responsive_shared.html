<style>
/* Shared responsive behavior for DailySuite pages. */
html, body { max-width: 100%; overflow-x: hidden; }
img, svg, canvas { max-width: 100%; }

.simple-form-page {
    min-height: 100dvh;
    margin: 0;
    padding: clamp(1rem, 5vw, 3rem);
    background: #f9fafb;
    color: #111827;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
}
.simple-form-page > h1,
.simple-form-page > h2,
.simple-form-page > h3,
.simple-form-page > h4,
.simple-form-page > form,
.simple-form-page > a,
.simple-form-page > p {
    display: block;
    width: min(100%, 36rem);
    margin-right: auto;
    margin-left: auto;
}
.simple-form-page > form {
    margin-top: 1.25rem;
    padding: clamp(1rem, 4vw, 2rem);
    border: 1px solid #e5e7eb;
    border-radius: 1rem;
    background: #fff;
}
.simple-form-page .container {
    width: min(100%, 36rem);
    margin: 1.25rem auto 0;
    padding: clamp(1rem, 4vw, 2rem);
    border: 1px solid #e5e7eb;
    border-radius: 1rem;
    background: #fff;
}
.simple-form-page nav {
    display: flex;
    width: min(100%, 36rem);
    margin: 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}
.simple-form-page input,
.simple-form-page select,
.simple-form-page textarea {
    width: 100%;
    max-width: 100%;
    margin-top: .35rem;
    padding: .7rem .85rem;
    border: 1px solid #d1d5db;
    border-radius: .6rem;
    background: #fff;
}
.simple-form-page button,
.simple-form-page input[type="submit"] {
    width: auto;
    padding: .7rem 1rem;
    border: 0;
    border-radius: .6rem;
    background: #111827;
    color: #fff;
    font-weight: 600;
}

.responsive-menu-toggle,
.responsive-sidebar-overlay { display: none; }

.responsive-table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

@media (max-width: 1023px) {
    .sidebar {
        position: fixed !important;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(16rem, 84vw) !important;
        height: 100dvh !important;
        overflow-y: auto;
        transform: translateX(-105%);
        transition: transform .25s ease;
        z-index: 1001 !important;
    }
    body.mobile-nav-open { overflow: hidden; }
    body.mobile-nav-open .sidebar { transform: translateX(0); }
    .responsive-menu-toggle {
        position: fixed;
        top: .75rem;
        left: .75rem;
        z-index: 1002;
        display: inline-flex;
        width: 2.5rem;
        height: 2.5rem;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e7eb;
        border-radius: .7rem;
        background: #111827;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
    }
    .responsive-sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: block;
        visibility: hidden;
        background: rgba(17, 24, 39, .42);
        opacity: 0;
        transition: opacity .25s ease, visibility .25s ease;
    }
    body.mobile-nav-open .responsive-sidebar-overlay { visibility: visible; opacity: 1; }
    .main-content {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        padding: 1.5rem !important;
    }
    body > .fixed.top-0.left-0.right-0,
    body > header.fixed,
    body > header.sticky { padding-left: 4rem !important; }
    .main-content .grid-cols-4,
    .main-content .lg\:grid-cols-4,
    .main-content .grid-cols-3,
    .main-content .lg\:grid-cols-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
    .modal-content,
    [role="dialog"] > div {
        width: min(92vw, 36rem) !important;
        max-width: 92vw !important;
        max-height: 88dvh !important;
        overflow-y: auto;
    }
    body .chat-widget,
    body .budget-chat-widget {
        right: 1rem !important;
        bottom: 1rem !important;
        width: min(24rem, calc(100vw - 2rem)) !important;
        height: min(34.375rem, calc(100dvh - 5rem)) !important;
        max-height: calc(100dvh - 5rem) !important;
    }
    body .chat-widget.collapsed,
    body .budget-chat-widget.collapsed {
        width: min(24rem, calc(100vw - 2rem)) !important;
        height: 3.75rem !important;
    }
    .chat-messages,
    .budget-chat-messages {
        min-height: 0;
        overflow-y: auto;
    }
    .chat-input-container,
    .budget-chat-input-container {
        width: 100%;
        min-width: 0;
    }
    .chat-input,
    .budget-chat-input {
        min-width: 0;
    }
    .chat-send-btn,
    .budget-chat-send-btn {
        flex: 0 0 auto;
    }
}

@media (max-width: 640px) {
    .main-content { padding: 1rem !important; }
    .main-content .w-\[400px\] { width: 100% !important; max-width: 100% !important; }
    body > .fixed.top-0.left-0.right-0,
    body > header.fixed,
    body > header.sticky {
        padding-right: .75rem !important;
        padding-left: 3.75rem !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:first-child > :first-child {
        display: none !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:first-child > :last-child:not(h1) {
        display: none !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:first-child > h1 {
        font-size: 1.15rem !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:last-child > div {
        display: none !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:last-child > a {
        padding: .65rem !important;
        font-size: 0 !important;
    }
    body > .fixed.top-0.left-0.right-0 > div:last-child > a i {
        margin: 0 !important;
        font-size: 1rem !important;
    }
    .main-content .grid:not(.grid-cols-7),
    .main-content .grid-cols-2,
    .main-content .grid-cols-3,
    .main-content .grid-cols-4,
    .main-content .md\:grid-cols-2,
    .main-content .lg\:grid-cols-2,
    .main-content .lg\:grid-cols-3,
    .main-content .lg\:grid-cols-4 {
        grid-template-columns: minmax(0, 1fr) !important;
    }
    .main-content h1,
    .main-content .text-4xl,
    .main-content .text-3xl {
        font-size: clamp(1.5rem, 8vw, 2rem) !important;
        line-height: 1.2 !important;
    }
    .main-content table { min-width: 38rem; }
    input, select, textarea, button { font-size: 16px; }
    body .chat-widget,
    body .budget-chat-widget {
        right: .5rem !important;
        bottom: .5rem !important;
        width: calc(100vw - 1rem) !important;
        height: min(34rem, calc(100dvh - 4.5rem)) !important;
        max-height: calc(100dvh - 4.5rem) !important;
        border-radius: .875rem !important;
    }
    body .chat-widget.collapsed,
    body .budget-chat-widget.collapsed {
        right: .5rem !important;
        bottom: .5rem !important;
        width: calc(100vw - 1rem) !important;
        height: 3.75rem !important;
        border-radius: .875rem !important;
    }
    .chat-header,
    .budget-chat-header {
        min-height: 3.75rem;
        padding: .875rem 1rem !important;
    }
    .chat-messages,
    .budget-chat-messages {
        padding: 1rem !important;
    }
    .chat-input-container,
    .budget-chat-input-container {
        gap: .5rem !important;
        padding: .75rem !important;
    }
    .chat-button, .chat-toggle {
        right: .75rem !important;
        bottom: .75rem !important;
        max-width: calc(100vw - 1.5rem) !important;
    }
}
</style>
<script>
(function () {
    'use strict';

    function initializeResponsiveLayout() {
        var sidebar = document.querySelector('.sidebar');
        if (sidebar && sidebar.id !== 'mobileSidebar' && !document.querySelector('.responsive-menu-toggle')) {
            var toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'responsive-menu-toggle';
            toggle.setAttribute('aria-label', 'Open navigation');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.innerHTML = '<i class="fas fa-bars" aria-hidden="true"></i>';

            var overlay = document.createElement('button');
            overlay.type = 'button';
            overlay.className = 'responsive-sidebar-overlay';
            overlay.setAttribute('aria-label', 'Close navigation');
            document.body.appendChild(overlay);
            document.body.appendChild(toggle);

            function setMenu(open) {
                document.body.classList.toggle('mobile-nav-open', open);
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
                toggle.innerHTML = open
                    ? '<i class="fas fa-times" aria-hidden="true"></i>'
                    : '<i class="fas fa-bars" aria-hidden="true"></i>';
            }

            toggle.addEventListener('click', function () {
                setMenu(!document.body.classList.contains('mobile-nav-open'));
            });
            overlay.addEventListener('click', function () { setMenu(false); });
            sidebar.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { setMenu(false); });
            });
            window.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') setMenu(false);
            });
            window.addEventListener('resize', function () {
                if (window.innerWidth >= 1024) setMenu(false);
            });
        }

        document.querySelectorAll('.main-content table').forEach(function (table) {
            if (table.parentElement && !table.parentElement.classList.contains('responsive-table-wrap')) {
                var wrapper = document.createElement('div');
                wrapper.className = 'responsive-table-wrap';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeResponsiveLayout);
    } else {
        initializeResponsiveLayout();
    }
}());
</script>
